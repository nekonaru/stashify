name: Release

on:
  push:
    tags: ["v*"]

jobs:
  draft:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install dependencies and run tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]
          python -m pytest -q

      - name: Build release notes from changelogs
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          extract() {
            awk -v ver="## v${VERSION}" '
              $0 == ver { found=1; next }
              found && /^## v/ { exit }
              found { print }
            ' "$1"
          }
          {
            echo "# English"
            echo
            extract CHANGELOG.md
            echo
            echo "<br>"
            echo
            echo "---"
            echo
            echo "<br>"
            echo
            echo "# Bahasa Indonesia"
            echo
            extract CHANGELOG.id.md
          } > RELEASE_NOTES.md

      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --draft \
            --title "Stashify ${GITHUB_REF_NAME}" \
            --notes-file RELEASE_NOTES.md
