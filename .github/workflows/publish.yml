name: Publish

# Publishes the package to PyPI using a trusted publisher (OIDC).
# Setup is one time, done by the maintainer on PyPI:
#   pypi.org/manage/account/publishing/ -> "Add a new pending publisher"
#   Project name: stashify-cli  |  Owner: nekonaru  |  Repository: stashify
#   Workflow name: publish.yml  |  Environment name: (leave empty)
# After that, run this workflow from the Actions tab on the tag you want
# to release. It refuses to run on anything except a tag whose name matches
# the version in pyproject.toml.

on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # required for OIDC trusted publishing, nothing else
    steps:
      - name: Check out the tagged release
        uses: actions/checkout@v4

      - name: Verify this run is from a tag matching the package version
        run: |
          if [ "${{ github.ref_type }}" != "tag" ]; then
            echo "Publish only runs on tags, got ref_type=${{ github.ref_type }}"
            exit 1
          fi
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "$TAG" != "$PKG" ]; then
            echo "Tag v$TAG does not match package version $PKG"
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build and verify
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check dist/*

      - name: Smoke test the wheel
        run: |
          python -m pip install --force-reinstall dist/*.whl
          stashify --version

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
