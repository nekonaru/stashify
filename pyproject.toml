[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "stashify-cli"
version = "1.3.0"
description = "Find music from your Spotify library on YouTube and save it locally with cover art, lyrics and full metadata."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Nicolas Dwi Dharma" }]
keywords = ["music", "spotify", "youtube", "downloader", "cli", "spotify-playlist", "mp3"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Utilities",
]
dependencies = [
    "requests>=2.31",
    "yt-dlp>=2024.8.6",
    "mutagen>=1.46",
]

[project.urls]
Homepage = "https://github.com/nekonaru/stashify"
Repository = "https://github.com/nekonaru/stashify"
Issues = "https://github.com/nekonaru/stashify/issues"
Changelog = "https://github.com/nekonaru/stashify/blob/main/CHANGELOG.md"
Security = "https://github.com/nekonaru/stashify/security/advisories"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
stashify = "stashify.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
